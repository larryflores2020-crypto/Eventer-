name: eventer
description: A Flutter app to discover local events, yard sales, car shows, and pop-ups across the USA.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  
  # HTTP & API
  http: ^1.1.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  
  # Location Services
  geolocator: ^9.0.0
  
  # Maps
  google_maps_flutter: ^2.5.0
  
  # UI & Icons
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.0
  
  # Date/Time
  intl: ^0.19.0
  
  # Environment Variables
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700